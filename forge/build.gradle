plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}
base {
    // abysscore-forge-1.20.1-<version>.jar, same naming as the NeoForge jar
    archivesName = "${mod_id}-forge-${forge_minecraft_version}"
}

// Forge 1.20.1 runs on Java 17. multiloader-common sets the toolchain to java_version (21,
// for NeoForge 1.21.1); a Java 21 class file can't be loaded by Java 17, so override it here.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

mixin {
    // The mixin annotation processor writes this refmap: it maps our (Mojang) method names
    // to the SRG names Forge 1.20.1 uses at runtime. Both mixin configs point to it.
    add sourceSets.main, "${mod_id}.refmap.json"
    config("${mod_id}.mixins.json")
    config("${mod_id}.forge.mixins.json")
}

repositories {
    mavenLocal()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroupByRegex("software\\.bernie.*") }
    }
    maven { url = 'https://cursemaven.com' }
}

minecraft {
    mappings channel: 'official', version: forge_minecraft_version

    copyIdeResources = true //Calls processResources when in dev

    // reobf stays ON (the default): Forge 1.20.1 still uses SRG names at runtime, so the jar
    // is remapped from Mojang names to SRG by the reobfJar task. (The template turned it off
    // because Forge 1.20.6+ uses Mojang names at runtime — not true for 1.20.1.)

    // Automatically enable forge AccessTransformers if the file exists
    // This location is hardcoded in Forge and can not be changed.
    // https://github.com/MinecraftForge/MinecraftForge/blob/be1698bb1554f9c8fa2f58e32b9ab70bc4385e60/fmlloader/src/main/java/net/minecraftforge/fml/loading/moddiscovery/ModFile.java#L123
    // Forge still uses SRG names during compile time, so we cannot use the common AT's
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformer = at
    }

    runs {
        client {
            workingDirectory file('runs/client')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Client'
            mods {
                modClientRun {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory file('runs/server')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Server'
            mods {
                modServerRun {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory file('runs/data')
            ideaModule "${rootProject.name}.${project.name}.main"
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            taskName 'Data'
            mods {
                modDataRun {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    minecraft "net.minecraftforge:forge:${forge_minecraft_version}-${forge_version}"
    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")

    // Forge's hack fix
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }

    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:${for_geckolib_version}")
}

// The reobfJar task remaps the jar IN PLACE (Mojang names → SRG). It must run after EVERY jar build,
// otherwise a later "jar" (e.g. from publishToMavenLocal) overwrites it with a Mojang-named jar that
// crashes on a real Forge 1.20.1 install. Same as Forge's own MDK: jar is finalized by reobfJar,
// and publishing waits for it so Maven also gets the SRG jar.
tasks.named('jar') { finalizedBy 'reobfJar' }
tasks.withType(AbstractPublishToMaven).configureEach { dependsOn 'reobfJar' }

publishing {
    publications {
        mavenJava(MavenPublication) {
            // multiloader-common already set artifactId from archivesName BEFORE this file changed it,
            // which gave "abysscore-forge-1.21.1". Set it again so Maven matches the jar name.
            artifactId = "${mod_id}-forge-${forge_minecraft_version}"
            fg.component(it)
        }
    }
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}
